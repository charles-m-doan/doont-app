<div class="content">
  <h1>{{ title }}</h1>

  <div class="tabs" role="tablist" aria-label="Doont tabs">
    <button
            type="button"
            role="tab"
            [attr.aria-selected]="activeTab === 'records'"
            [class.active]="activeTab === 'records'"
            (click)="setTab('records')">
      Records
    </button>
    <button
            type="button"
            role="tab"
            [attr.aria-selected]="activeTab === 'leaderboard'"
            [class.active]="activeTab === 'leaderboard'"
            (click)="setTab('leaderboard')">
      Leaderboard
    </button>
  </div>

  <app-records *ngIf="activeTab === 'records'"></app-records>
  <app-leaderboard *ngIf="activeTab === 'leaderboard'"></app-leaderboard>
</div>
