<p>Leaderboard Works</p>

<ng-container *ngIf="dataService.leaderboardReady$ | async; else loading">
	<p>Doont.xlsx loaded.</p>
	<p>Latest SHA: {{ dataService.sha$ | async }}</p>
</ng-container>

<ng-template #loading>
	<p>Loading Doont.xlsx…</p>
	<p>Latest SHA: {{ dataService.sha$ | async }}</p>
</ng-template>
