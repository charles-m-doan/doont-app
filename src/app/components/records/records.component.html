<p>Records Works</p>

<ng-container *ngIf="dataService.recordsReady$ | async; else loading">
    <p>Screenshots loaded: {{ dataService.screenshotsCount$ | async }}</p>
</ng-container>

<ng-template #loading>
    <p>Loading screenshots…</p>
    <p>Screenshots loaded so far: {{ dataService.screenshotsCount$ | async }}</p>
</ng-template>
